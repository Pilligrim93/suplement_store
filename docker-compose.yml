version: '3.8'

services:
  # =================================================================
  # ИНСТАНС 1: СЕЙФ БИЗНЕС-ДАННЫХ (Корзины, гостевые токены, остатки, кэш-каталог)
  # =================================================================
  redis_cart:
    image: redis:7.2-alpine
    container_name: pharma_redis_cart
    # МАКСИМАЛЬНАЯ БРОНЯ: Включаю жесткий секундный сброс AOF и ленивый RDB-снапшот.
    # Автоудаление NOEVICTION — Redis зубами держит корзины и остатки товаров, защищая от OOM.
    command: redis-server --appendonly yes --appendfsync everysec --save 900 1 --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - pharma_redis_cart_data:/data
    restart: always

  # =================================================================
  # ИНСТАНС 2: КЭШ ШАБЛОНОВ И ВЁРСТКИ HTML (Только Server-Side Rendering)
  # =================================================================
  redis_html:
    image: redis:7.2-alpine
    container_name: pharma_redis_html
    # ТАКТИКА СКОРОСТИ: Диск полностью ОТКЛЮЧЕН (appendonly no, save ""). Запись на диск равна 0.
    # Политика ALLKEYS-LRU: При нехватке ОЗУ Redis сам бесшумно выкинет старые забытые HTML-страницы.
    command: redis-server --appendonly no --save "" --maxmemory-policy allkeys-lru
    ports:
      - "6380:6380"
    # Диск volume не нужен, так как этот кэш временный и легко пересобирается силами Django
    restart: always

  # =================================================================
  # ИНСТАНС 3: БРОКЕР ОЧЕРЕДЕЙ И ФОНОВЫХ ЗАДАЧ CELERY
  # =================================================================
  redis_celery:
    image: redis:7.2-alpine
    container_name: pharma_redis_celery
    # ЗАЩИТА ОТ ПОТЕРЬ ЗАКАЗОВ: Включаю секундный AOF и ленивый RDB, чтобы задачи не стерлись при сбое.
    # Автоудаление NOEVICTION: Задачи обязаны копиться, пока воркеры их не обработают. Стирать их нельзя!
    command: redis-server --appendonly yes --appendfsync everysec --save 900 1 --maxmemory-policy noeviction
    ports:
      - "6381:6381"
    volumes:
      - pharma_redis_celery_data:/data
    restart: always

  # =================================================================
  # ЖИВОЙ ЩИТ СУБД: ПУЛЕР СОКЕТОВ PGBOUNCER (Запирает SSH-туннель на хосте)
  # =================================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pharma_pgbouncer
    environment:
      # Направляю пулер на мой внешний PostgreSQL через host.docker.internal:5432
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${PGBOUNCER_BACKEND_HOST}:${PGBOUNCER_BACKEND_PORT}/${DB_NAME}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=10
      - MAX_CLIENT_CONN=1000
      - SHOW_DATABASES=0
    ports:
      - "6432:6432"
    restart: always

  # =================================================================
  # ВЕБ-СЕРВЕР DJANGO
  # =================================================================
  web:
    build: .
    container_name: pharma_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Направляю отправку задач строго в ИЗОЛИРОВАННЫЙ 3-й инстанс на порт 6382!
      - CELERY_BROKER_URL=redis://redis_celery:6382/0
    depends_on:
      - redis_cart
      - redis_html
      - redis_celery
      - pgbouncer
    restart: always

  # =================================================================
  # АСИНХРОННЫЕ ВОРКЕРЫ CELERY
  # =================================================================
  celery:
    build: .
    container_name: pharma_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # Воркеры слушают и выгребают задачи тоже строго из 3-го инстанса на порту 6382
      - CELERY_BROKER_URL=redis://redis_celery:6382/0
    depends_on:
      - redis_cart
      - redis_html
      - redis_celery
      - pgbouncer
      - web
    restart: always

volumes:
  pharma_redis_cart_data:
  pharma_redis_celery_data: # Создаю вечный диск под лог-файлы фоновых задач




