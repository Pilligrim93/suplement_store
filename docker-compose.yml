version: '3.8'

services:
  # === ИНСТАНС 1: СЕЙФ КОРЗИН (Броня данных, AOF+RDB) ===
  redis_cart:
    image: redis:7.2-alpine
    container_name: pharma_redis_cart
    # Я включаю жесткое логирование AOF и noeviction, чтобы корзины никогда не стерлись
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - pharma_redis_cart_data:/data
    restart: always

  # === ИНСТАНС 2: ПАСПОРТА ТОВАРОВ КАТАЛОГА (Легкий RDB) ===
  redis_catalog:
    image: redis:7.2-alpine
    container_name: pharma_redis_catalog
    # Я убираю тяжелый AOF, оставляю только редкий RDB-снапшот на случай перезагрузки
    command: redis-server --appendonly no --save 900 1 --maxmemory-policy noeviction
    ports:
      - "6380:6380"
    volumes:
      - pharma_redis_catalog_data:/data
    restart: always

  # === ИНСТАНС 3: КЭШ ШАБЛОНОВ И ВЁРСТКИ (Максимальная скорость, LRU-очистка, БЕЗ диска) ===
  redis_html:
    image: redis:7.2-alpine
    container_name: pharma_redis_html
    # Я полностью вырезаю сохранение на диск и включаю авто-выброс старого кэша при нехватке ОЗУ
    command: redis-server --appendonly no --save "" --maxmemory-policy allkeys-lru
    ports:
      - "6381:6381"
    restart: always

  # === ЖИВОЙ ЩИТ СУБД ===
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pharma_pgbouncer
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${PGBOUNCER_BACKEND_HOST}:${PGBOUNCER_BACKEND_PORT}/${DB_NAME}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=10
      - MAX_CLIENT_CONN=1000
      - SHOW_DATABASES=0
    ports:
      - "6432:6432"
    restart: always

  # === ВЕБ-СЕРВЕР DJANGO ===
  web:
    build: .
    container_name: pharma_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Я направляю брокер Celery-задач (очередь) на инстанс корзин (или можно выделить под задачи БД 0)
      - CELERY_BROKER_URL=redis://redis_cart:6379/0
    depends_on:
      - redis_cart
      - redis_catalog
      - redis_html
      - pgbouncer
    restart: always

  # === АСИНХРОННЫЕ ВОРКЕРЫ CELERY ===
  celery:
    build: .
    container_name: pharma_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis_cart:6379/0
    depends_on:
      - redis_cart
      - redis_catalog
      - redis_html
      - pgbouncer
      - web
    restart: always

volumes:
  pharma_redis_cart_data:
  pharma_redis_catalog_data:



