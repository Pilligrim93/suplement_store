version: '3.8'

services:
  # =================================================================
  # ИНСТАНС 1: Корзины, гостевые токены, ключи идемпотентности, первичные остатки и лог-потоки Streams
  # =================================================================
  redis_cart:
    image: redis:7.2-alpine
    container_name: pharma_redis_cart
    # Жесткий секундный сброс AOF и ленивый RDB-снапшот.
    # Автоудаление NOEVICTION — Redis зубами держит корзины, остатки и лог-потоки Streams, защищая от OOM.
    command: redis-server --appendonly yes --appendfsync everysec --save 900 1 --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - pharma_redis_cart_data:/data
    restart: always

  # =================================================================
  # ИНСТАНС 2: КЭШ ШАБЛОНОВ И ВЁРСТКИ HTML (Только Server-Side Rendering)
  # =================================================================
  redis_html:
    image: redis:7.2-alpine
    container_name: pharma_redis_html
    # ТАКТИКА СКОРОСТИ: Диск полностью ОТКЛЮЧЕН (appendonly no, save ""). Запись на диск равна 0.
    # Политика ALLKEYS-LRU: При нехватке ОП Redis сам бесшумно выкинет старые забытые HTML-страницы.
    command: redis-server --appendonly no --save "" --maxmemory-policy allkeys-lru
    ports:
      - "6380:6380"
    # Диск volume не нужен, так как этот кэш временный и легко пересобирается силами Django
    restart: always

  # =================================================================
  # ИНСТАНС 3: БРОКЕР ОЧЕРЕДЕЙ И ФОНОВЫХ ЗАДАЧ CELERY
  # =================================================================
  redis_celery:
    image: redis:7.2-alpine
    container_name: pharma_redis_celery
    # ЗАЩИТА ЗАДАЧ ОТ ПОТЕРЬ: Секундный AOF и ленивый RDB, чтобы финансовые задачи не стерлись при сбое питания.
    # Автоудаление NOEVICTION: Задачи обязаны копиться в ОП, пока воркеры их не пережерт. Стирать их нельзя!
    command: redis-server --appendonly yes --appendfsync everysec --save 900 1 --maxmemory-policy noeviction
    ports:
      - "6381:6381"
    volumes:
      - pharma_redis_celery_data:/data
    restart: always

  # =================================================================
  # ИНСТАНС 4: ДВИЖОК КАТАЛОГА ТОВАРОВ И УЛЬТРА-ПОИСКА (RediSearch Модуль)
  # =================================================================
  redis_catalog:
    image: redis/redis-stack-server:latest
    container_name: pharma_redis_catalog
    # СБАЛАНСИРОВАННАЯ ЗАЩИТА: Отключаем тяжелый AOF, оставляем только ленивый RDB-снапшот раз в 15 минут.
    # Автоудаление NOEVICTION: Паспорта каталога и поисковые индексы RediSearch должны лежать в памяти железно.
    command: redis-server --appendonly no --save 900 1 --maxmemory-policy noeviction
    ports:
      - "6382:6382"
    volumes:
      - pharma_redis_catalog_data:/data
    restart: always

  # =================================================================
  # ПУЛЕР СОКЕТОВ PGBOUNCER (Запирает SSH-туннель на хосте)
  # =================================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pharma_pgbouncer
    environment:
      # Направляю пулер на мой внешний PostgreSQL через host.docker.internal:5432
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${PGBOUNCER_BACKEND_HOST}:${PGBOUNCER_BACKEND_PORT}/${DB_NAME}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=10
      - MAX_CLIENT_CONN=1000
      - SHOW_DATABASES=0
    ports:
      - "6432:6432"
    restart: always

  # =================================================================
  # ВЕБ-СЕРВЕР DJANGO
  # =================================================================
  web:
    build: .
    container_name: pharma_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Направляю отправку задач строго в ИЗОЛИРОВАННЫЙ 3-й инстанс на последовательный порт 6381!
      - CELERY_BROKER_URL=redis://redis_celery:6381/0
    depends_on:
      - redis_cart
      - redis_html
      - redis_celery
      - redis_catalog
      - pgbouncer
    restart: always

  # =================================================================
  # АСИНХРОННЫЕ ВОРКЕРЫ CELERY
  # =================================================================
  celery:
    build: .
    container_name: pharma_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # Воркеры слушают и выгребают задачи тоже строго из 3-го инстанса на порту 6381
      - CELERY_BROKER_URL=redis://redis_celery:6381/0
    depends_on:
      - redis_cart
      - redis_html
      - redis_celery
      - redis_catalog
      - pgbouncer
      - web
    restart: always

volumes:
  pharma_redis_cart_data:
  pharma_redis_celery_data: # Создаю вечный диск под лог-файлы фоновых задач
  pharma_redis_catalog_data: # Вечный диск под снапшоты поисковых индексов каталога
