
<form hx-post="{% url 'users:login' %}" hx-target="#auth-container" class="p-3 p-lg-5 border">
    {% csrf_token %}
    
    <!-- ОБЯЗАТЕЛЬНО: Общие ошибки (неверный пароль/логин тут) -->
    {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors|join:", "}}</div>
    {% endif %}

    <div class="form-group row">
        <div class="col-md-12">
            <label class="text-black">Логин</label>
            <input type="text" name="username" class="form-control" 
                value="{{ form.username.value|default:'' }}" required>
            <!-- Добавляем вывод ошибки конкретно под этим полем -->
            {% if form.username.errors %}
                <small class="text-danger">{{ form.username.errors|join:", " }}</small>
            {% endif %}
        </div>
    </div>
    
    <div class="form-group row">
        <div class="col-md-12">
            <label class="text-black">Пароль</label>
            <input type="password" name="password" class="form-control" required>

            {% if form.password.errors %}
                <small class="text-danger">{{ form.password.errors|join:", " }}</small>
            {% endif %}
        </div>
    </div>

    <div class="form-group row">
        <div class="col-lg-12">
            <button type="submit" class="btn btn-primary btn-lg btn-block">Войти</button>
        </div>
    </div>

    <div class="mt-3 text-center">
        <span> Нет аккаунта? </span>
        <!-- HTMX переключит контент в #auth-container на форму регистрации -->
        <button type="button" class="btn btn-link p-0" 
                hx-get="{% url 'users:registration' %}" 
                hx-target="#auth-container">Зарегистрироваться</button>
    </div>
</form>
